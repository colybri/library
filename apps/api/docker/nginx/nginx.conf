# Login attempts per client address: 10 per minute with a burst of 5, so
# password guessing and the cost of hashing each attempt stay bounded.
limit_req_zone $binary_remote_addr zone=library_login:10m rate=10r/m;
limit_req_status 429;

map $http_x_forwarded_proto $fe_https {
  default off;
  https on;
}

server {
    listen 80;

    listen 443 ssl;
    ssl_certificate     /etc/nginx/certificates/cert.pem;
    ssl_certificate_key /etc/nginx/certificates/key.pem;

    server_tokens off;
    # JSON bodies of the API are small. Only the upload of edition resources
    # accepts more (location below), so an anonymous client cannot send 210 MB
    # to any other route, the login included.
    client_max_body_size 2M;
    gzip on;
    gzip_comp_level 6;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types text/css text/x-component application/x-javascript application/javascript text/javascript text/x-js text/richtext image/svg+xml text/plain text/xsd text/xsl text/xml image/bmp application/java application/msword application/vnd.ms-fontobject application/x-msdownload image/x-icon image/webp application/json application/vnd.ms-access application/vnd.ms-project application/x-font-otf application/vnd.ms-opentype application/vnd.oasis.opendocument.database application/vnd.oasis.opendocument.chart application/vnd.oasis.opendocument.formula application/vnd.oasis.opendocument.graphics application/vnd.oasis.opendocument.spreadsheet application/vnd.oasis.opendocument.text audio/ogg application/pdf application/vnd.ms-powerpoint application/x-shockwave-flash image/tiff application/x-font-ttf audio/wav application/vnd.ms-write application/font-woff application/font-woff2 application/vnd.ms-excel;

    set $root /srv/app/public;

    root $root;

    index index.php index.html;

    # Logs: to the container output (docker logs) and to files in the
    # nginx_logs volume, which Filebeat reads (profile elastic)
    access_log /var/log/nginx/access.log;
    access_log /var/log/library-nginx/access.log;
    error_log /var/log/nginx/error.log;
    error_log /var/log/library-nginx/error.log;

    # Block all web requests to hidden directories
    location ~ /\. {
            deny all;
    }

    # Block access to build scripts.
    location ~* /(Gruntfile\.js|package\.json|node_modules) {
            deny all;
            return 404;
    }

    # Add cache headers for site assets.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|eot|woff|ttf)$ {
        expires 30d;
        add_header Pragma public;
        add_header Cache-Control "public";
    }

    # Swagger UI (service api_docs, profile docs, development only). The
    # variable makes nginx resolve the host per request, so nginx starts even
    # when api_docs is not running; then /docs/ answers 404.
    # ^~ stops the asset regex above from serving its .js and .css from public/.
    location ^~ /docs/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_docs http://api_docs:8080;
        proxy_pass $api_docs;
        proxy_set_header Host $host;
        error_page 502 504 =404 /docs-unavailable;
    }

    location = /docs-unavailable {
        internal;
        default_type text/plain;
        return 404 "Swagger UI is not running: make api-docs\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Symfony Web Profiler (dev kernel only): it shows request headers (JWT),
    # login bodies and the environment, without login. Only for this machine
    # and the compose network, whatever the published address of the ports.
    location ~ ^/(_profiler|_wdt)(/|$) {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        try_files $uri /index.php?$args;
    }

    # Login: rate limited per client address (zone at the top of this file)
    location = /api/v1/login_check {
        limit_req zone=library_login burst=5 nodelay;
        include snippets/library-php.conf;
    }

    # Upload of an edition resource: up to 200 MB (EditionResourceSize::MAX_BYTES)
    # plus the multipart overhead. The body limit is checked where the request
    # is handled, so this location passes to PHP-FPM itself.
    location ~ ^/api/v1/edition/[^/]+/resource$ {
        client_max_body_size 210M;
        include snippets/library-php.conf;
    }

    location ~ \.php$ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 4 32k;
        fastcgi_read_timeout 1200s;
        fastcgi_send_timeout 1200s;
        fastcgi_param HTTPS $fe_https;
        fastcgi_param SCRIPT_FILENAME $root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SERVER_NAME $host;
    }
}

# Status pages for Metricbeat (profile elastic). Port 8080 is not published:
# only containers of the compose network reach it.
server {
    listen 8080;
    server_tokens off;
    access_log off;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location = /nginx-status {
        stub_status;
    }

    # PHP-FPM pool status (pm.status_path in php-fpm.d/zz-docker.conf)
    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }

    location / {
        return 404;
    }
}
