; Only copied into the library_php_dev image (see Dockerfile).
; Settings for a driver that is not installed are ignored by PHP.

; PCOV: collect coverage for the application code only.
pcov.enabled = 1
pcov.directory = /srv/app/src

; Xdebug (COVERAGE_DRIVER=xdebug): coverage only, no step debugging.
xdebug.mode = coverage
