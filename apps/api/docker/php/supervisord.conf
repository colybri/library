; Supervisor of the api_consumers container: one program per RabbitMQ
; subscriber, written by library:rabbit:generate-supervisor (see
; docker/php/library-consumers.sh). Runs in the foreground as PID 1's child,
; as the container user: root in development, www-data in production.
[supervisord]
nodaemon = true
logfile  = /dev/null
logfile_maxbytes = 0
pidfile  = /tmp/supervisord.pid

[unix_http_server]
file = /tmp/supervisor.sock

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /tmp/supervisor.d/*.conf
