[global]
daemonize = no
process_control_timeout = 20

[www]
listen = /var/run/php/php-fpm.sock
listen.mode = 0666
ping.path = /ping

; Hardening recommended by php.net after CVE-2026-109619 and CVE-2026-115560:
; keep upload progress tracking off until the next maintenance release.
php_admin_flag[session.upload_progress.enabled] = off

; OpenTelemetry. The workers do not inherit the container environment
; (clear_env), so the OTEL_* variables are passed one by one. Tracing is on
; only in the PHP-FPM workers, where LIBRARY_TRACING=true turns it on: console
; commands in the same container (migrations, tests) are not traced.
; An undefined variable becomes an empty value, which the SDK ignores.
env[OTEL_PHP_AUTOLOAD_ENABLED] = $LIBRARY_TRACING
env[OTEL_SERVICE_NAME] = $OTEL_SERVICE_NAME
env[OTEL_RESOURCE_ATTRIBUTES] = $OTEL_RESOURCE_ATTRIBUTES
env[OTEL_TRACES_EXPORTER] = $OTEL_TRACES_EXPORTER
env[OTEL_METRICS_EXPORTER] = $OTEL_METRICS_EXPORTER
env[OTEL_LOGS_EXPORTER] = $OTEL_LOGS_EXPORTER
env[OTEL_PROPAGATORS] = $OTEL_PROPAGATORS
env[OTEL_EXPORTER_OTLP_PROTOCOL] = $OTEL_EXPORTER_OTLP_PROTOCOL
env[OTEL_EXPORTER_OTLP_ENDPOINT] = $OTEL_EXPORTER_OTLP_ENDPOINT
env[OTEL_EXPORTER_OTLP_HEADERS] = $OTEL_EXPORTER_OTLP_HEADERS
env[OTEL_EXPORTER_OTLP_CERTIFICATE] = $OTEL_EXPORTER_OTLP_CERTIFICATE
env[OTEL_EXPORTER_OTLP_TIMEOUT] = $OTEL_EXPORTER_OTLP_TIMEOUT
env[OTEL_BSP_SCHEDULE_DELAY] = $OTEL_BSP_SCHEDULE_DELAY
