services:
  monolog.processor.iterator:
    class: Colybri\Library\Infrastructure\Logging\Monolog\ProcessorIterator
    arguments:
      $processors:
        - '@monolog.processor.occurred_on'
        - '@monolog.processor.hostname'
        - '@monolog.processor.execution_time'
        - '@monolog.processor.info'
        - '@monolog.processor.domain_trace'
        - '@monolog.processor.normalize_message'
        - '@monolog.processor.trace_of_exception'
        - '@monolog.processor.trace_context'
    tags:
      - { name: monolog.processor }

  # JSON lines in Elastic Common Schema (trace.id, log.level, ...), read by Filebeat
  monolog.formatter.ecs:
    class: Elastic\Monolog\Formatter\ElasticCommonSchemaFormatter

  monolog.processor.trace_context:
    class: Colybri\Library\Infrastructure\Logging\Monolog\Processor\TraceContextProcessor

  monolog.processor.occurred_on:
    class: Colybri\Library\Infrastructure\Logging\Monolog\Processor\OccurredOnProcessor

  monolog.processor.hostname:
    class: Colybri\Library\Infrastructure\Logging\Monolog\Processor\HostnameProcessor

  monolog.processor.execution_time:
    class: Colybri\Library\Infrastructure\Logging\Monolog\Processor\ExecutionTimeProcessor
    autowire: true

  monolog.processor.info:
    class: Colybri\Library\Infrastructure\Logging\Monolog\Processor\InfoProcessor

  monolog.processor.domain_trace:
    class: PcComponentes\DddLogging\DomainTrace\DomainTraceProcessor
    autowire: true

  monolog.processor.normalize_message:
    class: PcComponentes\DddLogging\Context\NormalizeMessageProcessor

  monolog.processor.trace_of_exception:
    class: PcComponentes\DddLogging\ExceptionCatcher\TraceOfExceptionProcessor

