# Files of the edition resources, in an S3 compatible storage (SeaweedFS in
# docker compose). Inject it as FilesystemOperator $resourcesStorage.
flysystem:
    storages:
        resources.storage:
            adapter: 'aws'
            options:
                client: 'library.resources.s3_client'
                bucket: '%env(S3_BUCKET)%'

services:
    library.resources.s3_client:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: '%env(S3_REGION)%'
              endpoint: '%env(S3_ENDPOINT)%'
              # SeaweedFS and MinIO serve buckets as paths, not subdomains
              use_path_style_endpoint: true
              credentials:
                  key: '%env(S3_ACCESS_KEY)%'
                  secret: '%env(S3_SECRET_KEY)%'
