Created:
  description: Resource was created. The body is an empty JSON string.
  content:
    application/json:
      schema:
        type: string
        const: ''

Updated:
  description: Resource was updated

Deleted:
  description: Resource was deleted

InvalidArgument:
  description: The request contains an invalid argument
  content:
    application/json:
      schema:
        $ref: ../schemas/error.yml#/ValidationError

Unauthorized:
  description: The JWT is missing, invalid or expired
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: integer
            examples: [ 401 ]
          message:
            type: string
            examples: [ JWT Token not found ]
        required: [ code, message ]

NotFound:
  description: The resource, or a resource it references, does not exist
  content:
    application/json:
      schema:
        $ref: ../schemas/error.yml#/Error

Conflict:
  description: The request breaks a business rule, for example the resource already exists
  content:
    application/json:
      schema:
        $ref: ../schemas/error.yml#/Error
