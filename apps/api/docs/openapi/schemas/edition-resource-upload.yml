type: object
description: |
  Multipart form to upload a resource. The media type is detected from the
  content of the file, not from its extension or the part's Content-Type.
properties:
  id:
    type: string
    format: uuid
    description: Identifier of the new resource, generated by the client
    examples: [ 0b8f5a52-6c3e-4f0e-9d4a-2f1c7e9b6a10 ]
  name:
    type: string
    maxLength: 255
    description: Name shown for the resource. Defaults to the name of the file.
    examples: [ Scanned copy ]
  file:
    type: string
    format: binary
    contentMediaType: application/octet-stream
    description: |
      The file, at most 200 MB (209715200 bytes). Allowed types: PDF, EPUB,
      JPEG, PNG, WebP and plain text.
required: [ id, file ]
