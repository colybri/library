Page:
  type: object
  properties:
    total:
      type: integer
      minimum: 0
      description: Total number of items that match, across all pages
      examples: [ 272 ]
    offset:
      type: integer
      minimum: 0
      description: Position of the first item of this page
      examples: [ 0 ]
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: Maximum number of items in this page
      examples: [ 50 ]
  required: [ total, offset, limit, items ]
AuthorList:
  allOf:
    - $ref: '#/Page'
    - type: object
      properties:
        items:
          type: array
          items:
            $ref: ./author.yml
PublisherList:
  allOf:
    - $ref: '#/Page'
    - type: object
      properties:
        items:
          type: array
          items:
            $ref: ./publisher.yml
CountryList:
  allOf:
    - $ref: '#/Page'
    - type: object
      properties:
        items:
          type: array
          items:
            $ref: ./country.yml
