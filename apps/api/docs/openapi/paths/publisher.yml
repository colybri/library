collection:
  post:
    operationId: createPublisher
    summary: Create a publisher
    description: The client generates the identifier of the new publisher.
    tags: [ Publisher ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/publisher-write.yml
    responses:
      '201':
        $ref: ../components/responses.yml#/Created
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
      '409':
        $ref: ../components/responses.yml#/Conflict
  put:
    operationId: updatePublisher
    summary: Update a publisher
    description: Replaces every field of the publisher identified by `id` in the body.
    tags: [ Publisher ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/publisher-write.yml
    responses:
      '204':
        $ref: ../components/responses.yml#/Updated
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
      '409':
        $ref: ../components/responses.yml#/Conflict

match:
  get:
    operationId: matchPublisher
    summary: Search publishers
    description: Publishers whose name or city contains the keywords, in alphabetical order.
    tags: [ Publisher ]
    parameters:
      - $ref: ../parameters/query.yml
      - $ref: ../parameters/offset.yml
      - $ref: ../parameters/limit.yml
    responses:
      '200':
        description: Page of matching publishers
        content:
          application/json:
            schema:
              $ref: ../schemas/list.yml#/PublisherList
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized

item:
  parameters:
    - $ref: ../parameters/id.yml
  get:
    operationId: getPublisher
    summary: Get a publisher
    tags: [ Publisher ]
    responses:
      '200':
        description: The publisher
        content:
          application/json:
            schema:
              $ref: ../schemas/publisher.yml
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
  delete:
    operationId: deletePublisher
    summary: Delete a publisher
    tags: [ Publisher ]
    responses:
      '204':
        $ref: ../components/responses.yml#/Deleted
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
      '409':
        $ref: ../components/responses.yml#/Conflict
