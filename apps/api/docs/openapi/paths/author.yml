collection:
  post:
    operationId: createAuthor
    summary: Create an author
    description: The client generates the identifier of the new author.
    tags: [ Author ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/author-write.yml
    responses:
      '201':
        $ref: ../components/responses.yml#/Created
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
      '409':
        $ref: ../components/responses.yml#/Conflict
  put:
    operationId: updateAuthor
    summary: Update an author
    description: Replaces every field of the author identified by `id` in the body.
    tags: [ Author ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/author-write.yml
    responses:
      '204':
        $ref: ../components/responses.yml#/Updated
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
      '409':
        $ref: ../components/responses.yml#/Conflict

match:
  get:
    operationId: matchAuthor
    summary: Search authors
    description: Authors whose first name or last name contains any of the keywords (separated by spaces), most similar to the whole text first.
    tags: [ Author ]
    parameters:
      - $ref: ../parameters/query.yml
      - $ref: ../parameters/offset.yml
      - $ref: ../parameters/limit.yml
    responses:
      '200':
        description: Page of matching authors
        content:
          application/json:
            schema:
              $ref: ../schemas/list.yml#/AuthorList
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized

item:
  parameters:
    - $ref: ../parameters/id.yml
  get:
    operationId: getAuthor
    summary: Get an author
    tags: [ Author ]
    responses:
      '200':
        description: The author
        content:
          application/json:
            schema:
              $ref: ../schemas/author.yml
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
  delete:
    operationId: deleteAuthor
    summary: Delete an author
    tags: [ Author ]
    responses:
      '204':
        $ref: ../components/responses.yml#/Deleted
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
      '409':
        $ref: ../components/responses.yml#/Conflict
