match:
  get:
    operationId: matchCountry
    summary: Search countries
    description: Countries whose name or alpha-2 code contains the keywords, in alphabetical order.
    tags: [ Country ]
    parameters:
      - $ref: ../parameters/query.yml
      - $ref: ../parameters/offset.yml
      - $ref: ../parameters/limit.yml
    responses:
      '200':
        description: Page of matching countries
        content:
          application/json:
            schema:
              $ref: ../schemas/list.yml#/CountryList
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized

item:
  parameters:
    - $ref: ../parameters/id.yml
  get:
    operationId: getCountry
    summary: Get a country
    tags: [ Country ]
    responses:
      '200':
        description: The country
        content:
          application/json:
            schema:
              $ref: ../schemas/country.yml
      '400':
        $ref: ../components/responses.yml#/InvalidArgument
      '401':
        $ref: ../components/responses.yml#/Unauthorized
      '404':
        $ref: ../components/responses.yml#/NotFound
