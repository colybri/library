# Elastic stack for observability: Elasticsearch, Kibana and the APM Server
# (Filebeat and Metricbeat come in a later phase). Every service is in the
# "elastic" profile, so `make up` does not start them: use `make elastic-up`.
# Security is on, with TLS everywhere: elastic_setup creates a local CA and the
# certificates in the elastic_certs volume (`make elastic-ca` copies the CA out).
# Paths are relative to this directory (docker/).
x-elastic-image: &elastic_image docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.5.5}

services:
  # One-shot: certificates, kibana_system password, retention. Then it exits.
  elastic_setup:
    image: *elastic_image
    profiles: [elastic]
    user: "0"
    command: ["bash", "/setup/setup.sh"]
    restart: "no"
    volumes:
      - elastic_certs:/usr/share/elasticsearch/config/certs
      - ./elastic/setup:/setup:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      # Only checked here: compose must not fail without them when the profile is off
      KIBANA_ENCRYPTION_KEY: ${KIBANA_ENCRYPTION_KEY:-}
      APM_ES_PASSWORD: ${APM_ES_PASSWORD:-}
      ELASTIC_RETENTION: ${ELASTIC_RETENTION:-7d}
    # Healthy once the certificates exist: Elasticsearch waits for that.
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 2s
      timeout: 5s
      retries: 120

  elasticsearch:
    image: *elastic_image
    profiles: [elastic]
    restart: unless-stopped
    depends_on:
      elastic_setup:
        condition: service_healthy
    ports:
      # Only reachable from this machine
      - 127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200
    volumes:
      - elastic_certs:/usr/share/elasticsearch/config/certs:ro
      - elastic_data:/usr/share/elasticsearch/data
    environment:
      node.name: elasticsearch
      cluster.name: library
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      # As before: a nearly full laptop disk must not turn the indices read-only
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.license.self_generated.type: basic
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.5.5}
    profiles: [elastic]
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 127.0.0.1:${KIBANA_PORT:-5601}:5601
    volumes:
      - elastic_certs:/usr/share/kibana/config/certs:ro
      - kibana_data:/usr/share/kibana/data
    environment:
      SERVERNAME: kibana
      SERVER_PUBLICBASEURL: https://localhost:${KIBANA_PORT:-5601}
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: config/certs/kibana/kibana.crt
      SERVER_SSL_KEY: config/certs/kibana/kibana.key
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: config/certs/ca/ca.crt
      # Saved objects, alerting and sessions need these keys (32+ characters)
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-}
      TELEMETRY_OPTIN: "false"
    healthcheck:
      # Kibana answers 503 while it starts and 401 (no credentials) once ready.
      # Check only the status code: over TLS Kibana 9 speaks HTTP/2, so the
      # status line is not "HTTP/1.1 302 Found" as in older examples.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --cacert config/certs/ca/ca.crt https://localhost:5601/api/status | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  # Receives the traces of api and api_consumers (OTLP over HTTPS, port 8200)
  apm_server:
    image: docker.elastic.co/apm/apm-server:${ELASTIC_VERSION:-9.5.5}
    profiles: [elastic]
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      # library_apm, the user apm_server writes with, is created by elastic_setup
      elastic_setup:
        condition: service_completed_successfully
    # The configuration is mounted from the host, so its owner is not the image's user
    command: ["apm-server", "-e", "--strict.perms=false"]
    # The certificates belong to root:root (mode 640): read them through group 0
    group_add: ["0"]
    ports:
      - 127.0.0.1:${APM_SERVER_PORT:-8200}:8200
    volumes:
      - elastic_certs:/usr/share/apm-server/certs:ro
      - ./elastic/apm-server/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    environment:
      APM_SECRET_TOKEN: ${APM_SECRET_TOKEN:-}
      APM_ES_PASSWORD: ${APM_ES_PASSWORD:-}
    healthcheck:
      # Without a token the server answers 401 once it is up
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca/ca.crt https://localhost:8200/ | grep -qE '^(200|401)$$'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  elastic_certs:
    driver: local
  elastic_data:
    driver: local
  kibana_data:
    driver: local
