# Shared infrastructure: database, cache, message broker and admin tools.
# Paths are relative to this directory (docker/).
services:
  postgres:
    build:
      context: ./postgres
      target: library_postgres
    restart: unless-stopped
    # Logs go to files that Filebeat reads (profile elastic): one per weekday,
    # overwritten a week later. Slow statements (>= 200 ms) are logged too.
    # Settings are passed as flags (there is no custom postgresql.conf).
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/ssl/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/ssl/server.key
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
      - -c
      - log_min_duration_statement=200
      - -c
      - log_timezone=UTC
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
      # Named volume: it starts with the image's folder, owned by postgres
      - postgres_logs:/var/log/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_READ_PASS}
      POSTGRES_USER: ${POSTGRES_READ_USER}
    # Only from this machine: the published ports are for host tools (psql,
    # pgAdmin desktop, make). Set INFRA_BIND_ADDR=0.0.0.0 in .env to open them
    # to the network (they use the credentials of .env).
    ports:
      - ${INFRA_BIND_ADDR:-127.0.0.1}:5432:5432

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    # pgAdmin listens on port 80 inside the container
    ports:
      - ${INFRA_BIND_ADDR:-127.0.0.1}:5050:80

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    ports:
      - ${INFRA_BIND_ADDR:-127.0.0.1}:6379:6379
    # An empty password would leave "--requirepass" without a value and Redis
    # would not start: fail early with a clear message instead.
    command: redis-server --loglevel warning --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ../redis_data:/data/redis

  rabbitmq:
    image: rabbitmq:4.4.0
    restart: unless-stopped
    ports:
      - ${INFRA_BIND_ADDR:-127.0.0.1}:5672:5672
      - ${INFRA_BIND_ADDR:-127.0.0.1}:15672:15672
    # No user override: the image starts as root, fixes the ownership of the
    # amqp-data volume and drops to the rabbitmq user. Running it as the host
    # UID failed with "Error when reading /var/lib/rabbitmq/.erlang.cookie:
    # eacces" when the volume belonged to another user.
    volumes:
      - amqp-data:/var/lib/rabbitmq
      - ./rabbit/enabled_plugins:/etc/rabbitmq/enabled_plugins
      # Queue depth and consumers for Metricbeat (profile elastic)
      - ./rabbit/90-library-metrics.conf:/etc/rabbitmq/conf.d/90-library-metrics.conf:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_LOGIN}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # S3 compatible storage for the files of the edition resources (MinIO's
  # community edition is archived). Master, volume, filer and S3 gateway in one
  # container; the entrypoint creates the credentials and the bucket. Port 8333
  # is not published: only the API talks to it, downloads go through the API.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    entrypoint: ["/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-library-resources}
    volumes:
      - ./seaweedfs/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  amqp-data:
    driver: local
  postgres_logs:
    driver: local
  seaweedfs_data:
    driver: local
