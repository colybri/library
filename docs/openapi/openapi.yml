openapi: 3.1.0
info:
  version: 1.0.0
  title: Library
  description: A simple API for manage your personal library
servers:
  - url: https://localhost/


paths:
  /v1/author/match:
    get:
      description: Search author form name
      security:
        - JWTAuth:
            - 'public'
      parameters:
        - $ref: parameters/query.yml
        - $ref: parameters/offset.yml
        - $ref: parameters/limit.yml
      responses:
        '200':
          description: Author list matched
          content:
            application/json:
              schema:
                items:
                  Author:
                    $ref: schemas/author.yml
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                     - Request contains an invalid argument

  /v1/author/{id}:
    get:
      description: Retrieve an author from id
      security:
        - JWTAuth:
            - 'public'
      properties:
        id:
          type: string
      responses:
        '200':
          description: An author
          content:
            application/json:
              schema:
                $ref: schemas/author.yml
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                message:
                  type: string
  /v1/author:
    post:
      description: Create new author
      security:
        - JWTAuth:
            - 'public'
      requestBody:
        content:
          application/json:
          schema:
            $ref: schemas/author.yml
      responses:
        '201':
          description: Successfully created a new author
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                message:
                  type: string
    put:
      description: Update an author
      security:
        - JWTAuth:
            - 'public'
      requestBody:
        content:
          application/json:
            schema:
              $ref: schemas/author.yml
        responses:
          '200':
            description: Successfully updated an author
          '400':
            description: Invalid request
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string

    delete:
      description: Delete an author
      security:
        - JWTAuth:
            - 'public'
      content:
        application/json:
      properties:
        id:
          type: string
        responses:
          '200':
            description: Successfully deleted an author
          '400':
            description: Invalid request
            content:
              application/json:
                schema:
                  type: object
                  properties:
                  message:
                    type: string



  /v1/country/match:
    get:
      description: Search country form keyword
      security:
        - JWTAuth:
            - 'public'
      parameters:
        - required:
            $ref: parameters/query.yml
      responses:
        '200':
          description: Country list matched
          content:
            application/json:
              schema:
                items:
                  $ref: schemas/country.yml
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                message:
                  type: string

  /v1/country/{id}:
    get:
      description: Retrieve an country from id
      security:
        - JWTAuth:
            - 'public'
      properties:
        id:
          type: string
      responses:
        '200':
          description: A country
          content:
            application/json:
              schema:
                $ref: schemas/country.yml
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                message:
                  type: string


components:
  securitySchemes:
    JWTAuth:
      scheme: bearer
      type: http
      bearerFormat: jwt
      description: 'note: non-oauth scopes are not defined at the securityScheme level'
  schemas:
    Author:
      $ref: ./schemas/author.yml
    Country:
      $ref: ./schemas/country.yml




    
