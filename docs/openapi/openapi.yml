openapi: 3.1.0
info:
  version: 1.0.0
  title: Library
  description: A simple API for manage your personal library
servers:
  - url: https://localhost

paths:
  /v1/author/{id}:
    get:
      operationId: searchAuthor
      summary: Search author from name
      security:
        - JWTAuth: [ ]
      parameters:
        - $ref: ./parameters/query.yml
        - $ref: ./parameters/offset.yml
        - $ref: ./parameters/limit.yml
      responses:
        200:
          description: Author list matched
          content:
            application/json:
              schema:
                $ref: './schemas/list.yml#/Authors'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Author

  /v1/author/match:
    get:
      operationId: getAuthor
      summary: Retrieve an author from id
      security:
        - JWTAuth: []
      parameters: 
        - $ref: ./parameters/id.yml 
      responses:
        200:
          description: An author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        404:
          $ref: './components/responses.yml#/NotFound'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Author

  /v1/author:
    post:
      operationId: createAuthor
      summary: Create an author
      security:
        - JWTAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        201:
          $ref: './components/responses.yml#/Created'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        404:
          $ref: './components/responses.yml#/NotFound'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Author
    put:
      operationId: updateAuthor
      summary: Update an author
      security:
        - JWTAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        204:
          $ref: './components/responses.yml#/Updated'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        404:
          $ref: './components/responses.yml#/NotFound'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Author
    delete:
      operationId: deleteAuthor
      summary: Delete an author
      security:
        - JWTAuth: []
      parameters:
        - $ref: ./parameters/id.yml
      responses:
        204:
          $ref: './components/responses.yml#/Deleted'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        404:
          $ref: './components/responses.yml#/NotFound'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Author

  /v1/country/{id}:
    get:
      operationId: getCountry
      summary: Retrieve an country from id
      security:
        - JWTAuth: []
      parameters: 
        - $ref: ./parameters/id.yml 
      responses:
        200:
          description: An country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        404:
          $ref: './components/responses.yml#/NotFound'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Country
    
  /v1/country/match:
    get:
      operationId: searchCountry
      summary: Search country from name
      security:
        - JWTAuth: []
      parameters:
        - $ref: ./parameters/query.yml
        - $ref: ./parameters/offset.yml
        - $ref: ./parameters/limit.yml
      responses:
        200:
          description: Country list matched
          content:
            application/json:
              schema:
                $ref: './schemas/list.yml#/Countries'
        400:
          $ref: './components/responses.yml#/InvalidArgument'
        409:
          $ref: './components/responses.yml#/Conflict'
      tags:
        - Country


components:
  securitySchemes:
    JWTAuth:
      description: 'JWT Authentification'
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Author:
      $ref: ./schemas/author.yml
    Country:
      $ref: ./schemas/country.yml




    
