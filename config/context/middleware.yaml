services:
  _defaults:
    autowire: false
    autoconfigure: false
    public: false

  middleware.doctrine.transactional:
    class: Colybri\Library\Infrastructure\Messaging\Middleware\DoctrineTransactionalMiddleware
    arguments:
      - '@connection_write.dbal'
    autowire: true

  # Trace Middleware
  middleware.trace.request:
    class: PcComponentes\DddLogging\DomainTrace\RequestTraceMiddleware
    autowire: true

  middleware.trace.message:
    class: PcComponentes\DddLogging\DomainTrace\MessageTraceMiddleware
    autowire: true


  # Execution Time Middleware
  middleware.execution_time:
    class: PcComponentes\DddLogging\ExecutionTime\ExecutionTimeMiddleware
    autowire: true


  # Logging Middleware
  middleware.logging.command:
    autowire: true
    class: PcComponentes\DddLogging\MessageLogger\MessageLoggerMiddleware
    arguments:
      $action: '@middleware.logging.action.process'
    tags:
      - { name: monolog.logger, handler: commands, channel: library-simple-message }


  middleware.logging.action.publish:
    class: PcComponentes\DddLogging\MessageLogger\Action\PublishAction

  middleware.logging.action.process:
    class: PcComponentes\DddLogging\MessageLogger\Action\ProcessAction

  middleware.logging.action.persist:
    class: PcComponentes\DddLogging\MessageLogger\Action\PersistAction




