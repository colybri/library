grumphp:
  hooks_dir: ~
  hooks_preset: local
  stop_on_failure: false
  ignore_unstaged_changes: false
  hide_circumvention_tip: false
  process_timeout: 60
  ascii:
    failed: scripts/git/ko.txt
    succeeded: scripts/git/ok.txt
  parallel:
    enabled: true
    max_workers: 32
  fixer:
    enabled: true
    fix_by_default: false
  tasks:
    composer:
      strict: true
    securitychecker_symfony:
      lockfile: ./composer.lock
      format: ~
      run_always: false
    jsonlint: ~
    phplint: ~
    phpcs:
      standard:
        - 'phpcs.xml'
      whitelist_patterns:
        - 'src'
        - 'tests'
      encoding: 'UTF-8'
      severity: ~
      error_severity: 1
      warning_severity: 8
      tab_width: ~
      report: full
      report_width: ~
      ignore_patterns: [ ]
      sniffs: [ ]
      triggered_by: [ php ]
      exclude: [ ]
      show_sniffs_error_path: true
    phpstan:
      configuration: phpstan.neon
      memory_limit: "-1"
    phpunit: ~
    phpversion:
      project: '8.1'
