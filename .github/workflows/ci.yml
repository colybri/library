name: CI

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, static analysis and tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add 8.4 here once the migration reaches the PHP upgrade phase.
        php: [ '8.1' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, intl, json, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax
        run: vendor/bin/parallel-lint --exclude vendor --exclude var src tests config public

      - name: Coding standard
        run: vendor/bin/phpcs --standard=phpcs.xml --error-severity=1 --warning-severity=8

      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      - name: Lint configuration
        run: |
          bin/console lint:yaml config --parse-tags
          bin/console lint:container

      - name: PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml.dist

  prod-boot:
    name: Production boot without dev dependencies
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: ctype, iconv, intl, json, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --no-dev

      - name: Warm up the prod cache
        run: bin/console cache:warmup

      - name: Check the preload file matches the compiled container
        run: |
          test -f var/cache/prod/Colybri_Library_KernelProdContainer.preload.php
          php -d opcache.enable_cli=0 config/preload.php

      - name: Routes are loadable
        run: bin/console debug:router

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Report-only until the migration updates the 2022-era dependencies.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Audit composer.lock
        run: composer audit --locked --no-dev
