name: API

# CI of apps/api only. It runs when the API, the shared infrastructure or this
# workflow change; a PR that only touches another app or the docs skips it.
# Each app has its own workflow with the same layout (web.yml will follow).
on:
  push:
    branches: [ master ]
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

# The backend lives in apps/api: every `run` step starts there.
defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: Lint, static analysis and tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same version as the Docker image.
        php: [ '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: amqp, ctype, curl, iconv, intl, json, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax
        run: vendor/bin/parallel-lint --exclude vendor --exclude var src tests config public

      - name: Coding standard
        run: vendor/bin/phpcs --standard=phpcs.xml --error-severity=1 --warning-severity=8

      - name: PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      - name: Lint configuration
        run: |
          bin/console lint:yaml config --parse-tags
          bin/console lint:container

      - name: PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml.dist

  integration:
    name: Message bus integration (Postgres + RabbitMQ + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U library"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13
        ports: [ '5672:5672' ]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, ctype, curl, iconv, intl, json, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api

      - name: Load the schema from migrations/library.sql
        env:
          PGPASSWORD: library
        run: psql -h 127.0.0.1 -U library -d library -v ON_ERROR_STOP=1 -q -f migrations/library.sql

      - name: Integration tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite integration

  prod-boot:
    name: Production boot without dev dependencies
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, ctype, curl, iconv, intl, json, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
          composer-options: --no-dev

      - name: Warm up the prod cache
        run: bin/console cache:warmup

      - name: Check the preload file matches the compiled container
        run: |
          test -f var/cache/prod/Colybri_Library_KernelProdContainer.preload.php
          php -d opcache.enable_cli=0 config/preload.php

      - name: Routes are loadable
        run: bin/console debug:router

  docker:
    name: Docker image runs a patched PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BuildKit with the GitHub Actions cache: layers are reused between runs.
      # Nothing is pushed to any registry (push: false, load into the local daemon).
      - uses: docker/setup-buildx-action@v3

      - name: Build the PHP image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: library_php
          tags: library-php:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: PHP is at least 8.4.27 and FPM upload progress is off
        run: |
          docker run --rm --entrypoint php library-php:ci -r '
            if (version_compare(PHP_VERSION, "8.4.27", "<")) {
                fwrite(STDERR, "PHP " . PHP_VERSION . " is missing the 21 Oct 2026 security fixes\n");
                exit(1);
            }
            echo "PHP ", PHP_VERSION, " OK\n";'
          docker run --rm --entrypoint php-fpm library-php:ci -tt > fpm.txt 2>&1 || { cat fpm.txt; exit 1; }
          grep -E "session.upload_progress.enabled\]? *= *(off|0|'')? *$" fpm.txt \
            || { cat fpm.txt; echo "session.upload_progress.enabled is not off in the FPM pool"; exit 1; }

      - name: PHP-FPM answers the container healthcheck
        run: |
          docker run -d --name fpm --entrypoint php-fpm library-php:ci
          healthy=0
          for i in $(seq 15); do
            if docker exec fpm docker-healthcheck; then healthy=1; break; fi
            sleep 1
          done
          docker logs fpm
          docker rm -f fpm
          [ "$healthy" = 1 ] || { echo "docker-healthcheck does not reach PHP-FPM"; exit 1; }

      - name: Production image loads the amqp and redis extensions
        run: |
          docker run --rm --entrypoint php library-php:ci -m > modules.txt
          for ext in amqp redis; do
            grep -qix "$ext" modules.txt || { cat modules.txt; echo "The $ext extension is not loaded"; exit 1; }
          done

      - name: Production image has no coverage driver
        run: |
          if docker run --rm --entrypoint php library-php:ci -m | grep -Eix 'pcov|xdebug'; then
            echo "The production image must not ship a coverage driver"; exit 1
          fi

      - name: Build the development image (PCOV)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: library_php_dev
          tags: library-php-dev:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Editing the code does not rebuild the development image
        run: |
          echo "// cache check" >> src/Kernel.php
          docker buildx build --target library_php_dev --progress=plain . 2>&1 | tee dev-rebuild.log
          git checkout -- src/Kernel.php
          # pecl prints this only when it really compiles an extension.
          if grep -q "Build process completed successfully" dev-rebuild.log; then
            echo "A code change recompiled PHP extensions: the development image must not depend on the code"; exit 1
          fi

      - name: make report works inside the development image
        run: |
          docker run --rm --entrypoint php library-php-dev:ci -m | grep -qix pcov
          docker run --rm -v "$PWD:/srv/app" -w /srv/app --entrypoint sh library-php-dev:ci -c '
            set -e
            composer install --no-interaction --no-progress
            vendor/bin/phpunit --coverage-html gen/coverage --log-junit gen/junit.xml --coverage-text --only-summary-for-coverage-text
            vendor/bin/phpmetrics --junit=gen/junit.xml --report-html=gen/metrics src
            test -f gen/coverage/index.html
            test -f gen/metrics/index.html'

      # Same command as the api_consumers service in compose.api.yml, against a
      # real RabbitMQ: queues are declared and every subscriber gets a consumer.
      - name: api_consumers starts its consumers under supervisord
        run: |
          docker network create consumers-ci
          docker run -d --name rabbitmq --network consumers-ci \
            -e RABBITMQ_DEFAULT_USER=library -e RABBITMQ_DEFAULT_PASS=library \
            --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 30 \
            rabbitmq:3.13
          for i in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' rabbitmq)" = healthy ] && break
            sleep 2
          done
          docker run -d --name consumers --network consumers-ci -v "$PWD:/srv/app" \
            -e RABBITMQ_HOST=rabbitmq -e RABBITMQ_LOGIN=library -e RABBITMQ_PASSWORD=library \
            library-php-dev:ci library-consumers
          healthy=0
          for i in $(seq 30); do
            if docker exec consumers library-consumers-healthcheck; then healthy=1; break; fi
            sleep 2
          done
          [ "$healthy" = 1 ] || { docker logs consumers; echo "Some consumer is not RUNNING"; exit 1; }
          # The read timeout is 2 s: after several empty waits the program must
          # still be the same process (no restarts) with a single consumer.
          sleep 8
          docker exec consumers library-consumers-healthcheck
          docker logs consumers 2>&1 | tee consumers.log
          if grep -q "exited: library_" consumers.log; then echo "A consumer exited and was restarted"; exit 1; fi
          docker exec rabbitmq rabbitmqctl list_queues --quiet name consumers | tee queues.txt
          grep -E '^colybri\.library\.author\.update_snapshot_on_author_created_subscriber\s+1$' queues.txt

      - name: Xdebug variant builds
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: library_php_dev
          build-args: COVERAGE_DRIVER=xdebug
          tags: library-php-xdebug:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Xdebug is loaded
        run: |
          docker run --rm --entrypoint php library-php-xdebug:ci -m | grep -qix xdebug

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Report-only until the migration updates the 2022-era dependencies:
      # advisories show up as a warning and in the job summary, but the check
      # stays green. Make it blocking once the dependencies are up to date.
      - name: Audit composer.lock
        run: |
          if composer audit --locked --no-dev --format=plain > audit.txt 2>&1; then
            echo "No known advisories." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Dependency audit::composer audit reported advisories, see the job summary"
            { echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat audit.txt
